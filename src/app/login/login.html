<div class="login-wrapper">
  <div class="login-card">
    <div class="card-glow"></div>

    <div class="login-header">
      <div class="login-icon">
        <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10 2v3a4 4 0 0 0-1.5 3.2L4.3 16.5A4 4 0 0 0 7.8 22h8.4a4 4 0 0 0 3.5-5.5L15.5 8.2A4 4 0 0 0 14 5V2"/>
          <path d="M8.5 2h7"/>
          <path d="M7 16h10"/>
        </svg>
      </div>
      <h2>Welcome to Potion Shop</h2>
      <p class="login-subtitle">Sign in to access your magical inventory and orders.</p>
    </div>

    <form (ngSubmit)="onSubmit()" class="login-form">
      <div class="form-field">
        <label for="email">User Email</label>
        <div class="input-with-icon">
          <span class="field-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect width="20" height="16" x="2" y="4" rx="2"/>
              <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
            </svg>
          </span>
          <input 
            id="email" 
            type="email" 
            [(ngModel)]="credentials.email" 
            name="email" 
            placeholder="e.g. ana.jovanovic@example.com" 
            required 
          />
        </div>
      </div>

      <div class="form-field">
        <label for="password">Password</label>
        <div class="input-with-icon">
          <span class="field-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
          </span>
          <input 
            id="password" 
            type="password" 
            [(ngModel)]="credentials.password" 
            name="password" 
            placeholder="Enter your password" 
            required 
          />
        </div>
      </div>

      <button type="submit" class="btn-login-submit" [disabled]="isLoading">
        <span *ngIf="!isLoading">Sign In</span>
        <span *ngIf="isLoading">Signing in...</span>
      </button>
    </form>

    @if (error) {
      <div class="login-error-alert">
        {{ error }}
      </div>
    }

    <!-- Quick test account chips -->
    <div class="quick-login-section">
      <span class="quick-label">Quick test accounts:</span>
      <div class="user-chips">
        <button type="button" class="user-chip-btn" (click)="fillTestUser('ana.jovanovic@example.com')">
          Ana (Cards)
        </button>
        <button type="button" class="user-chip-btn" (click)="fillTestUser('marko.petrovic@example.com')">
          Marko
        </button>
        <button type="button" class="user-chip-btn" (click)="fillTestUser('admin@example.com')">
          Admin
        </button>
      </div>
    </div>
  </div>
</div>
